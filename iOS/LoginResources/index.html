<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; worker-src blob:">
  <title>Mac 登录</title>
  <style>
    html, body, #screen { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #141414; }
    #screen { touch-action: none; }
    #screen.input-only canvas { opacity: 0; }
    #guide { position: absolute; inset: 0; pointer-events: none; color: #e5e7eb; font: 16px -apple-system, sans-serif; }
    #guide[hidden] { display: none; }
    #guide-help { position: absolute; top: 24px; left: 24px; right: 24px; text-align: center; line-height: 1.6; }
    #guide-help strong { display: block; color: #fff; font-size: 22px; }
    #guide-frame { position: absolute; box-sizing: border-box; border: 1px solid #444; border-radius: 4px; }
    #guide-target { position: absolute; transform: translate(-50%, -50%); width: clamp(160px, 24vw, 260px); min-height: 44px;
      border: 2px dashed #5ac8fa; border-radius: 24px; background: #142a35; color: #fff; font: inherit;
      pointer-events: auto; cursor: pointer; touch-action: manipulation; }
    #guide-target:disabled { opacity: .5; cursor: default; }
    #guide-target::before { content: '+'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #5ac8fa; }
    #guide-note { position: absolute; left: 16px; right: 16px; bottom: 14px; text-align: center; font-size: 13px; color: #aaa; }
  </style>
</head>
<body>
  <div id="screen"></div>
  <div id="guide" hidden>
    <div id="guide-frame"></div>
    <div id="guide-help"><strong>仅键鼠控制 · 登录画面已暂停</strong>点击下方虚线框，再用妙控键盘输入 Mac 密码并按 Return。<br>关闭上方开关可恢复登录画面。</div>
    <button id="guide-target" type="button" tabindex="-1" disabled>点击密码框参考位置</button>
    <div id="guide-note" role="status">正在等待 Mac 屏幕尺寸…</div>
  </div>
  <script src="login.bundle.js"></script>
</body>
</html>
